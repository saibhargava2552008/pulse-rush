<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0524" />
      <stop offset="100%" stop-color="#040212" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2bf0ff" />
      <stop offset="60%" stop-color="#00aaff" />
      <stop offset="100%" stop-color="#ff6a1a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded plate -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="#2bf0ff" stroke-width="2" stroke-opacity="0.6" />

  <!-- Cyber grid lines -->
  <line x1="8" y1="46" x2="56" y2="46" stroke="#2bf0ff" stroke-width="0.75" stroke-opacity="0.3" />
  <line x1="16" y1="52" x2="48" y2="52" stroke="#2bf0ff" stroke-width="0.5" stroke-opacity="0.25" />
  <line x1="12" y1="58" x2="28" y2="46" stroke="#2bf0ff" stroke-width="0.6" stroke-opacity="0.3" />
  <line x1="52" y1="58" x2="36" y2="46" stroke="#2bf0ff" stroke-width="0.6" stroke-opacity="0.3" />

  <!-- Dynamic Pulse Lightning Path -->
  <path d="M 35 10 L 16 33 L 30 33 L 26 54 L 48 29 L 34 29 Z"
        fill="url(#pulseGrad)"
        filter="url(#glow)" />
</svg>
